<style>

[data-d="1"]{--bg:#14131c;--cd:#1e1d2a;--tx:#efeefa;--mu:#a19fb8;--bd:#32304a;--ok:#3ccf91;--bad:#ff6b76}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-left:64px;min-height:100vh;display:flex;flex-direction:column}

.bar{height:8px;border-radius:9px;background:#00000026;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}

.wrap{display:flex;gap:22px;max-width:1240px;margin:0 auto;width:100%;padding:18px 20px;flex:1;align-items:flex-start}.col{flex:1;min-width:0;max-width:820px}

</style></head><body>
<div class="wrap"><div class="col"><header><div><h1 id="ttl"></h1><div class="mu">FocusFund · ADHD Budget Planner <span class="tag" style="background:var(--ac);color:#fff;border:0">DEMO</span></div></div><button class="g" onclick="S.focus=!S.focus;save();draw()" id="fb"></button></header>
<main id="app"></main></div><aside id="rp"></aside></div><footer>All Rights Reserved <b>BrandingStudioCo</b></footer><nav id="nav"></nav><div id="toast"></div>
<script>
const CATS=['Food','Transport','Bills','Fun','Shopping','Health','Other'],TH=[['coral','#ff5a5f'],['ocean','#0a7ea4'],['forest','#2e8b57'],['rose','#d6366f'],['sunset','#d9680f'],['slate','#475569']];
const D0={cur:'$',theme:'coral',mode:'light',focus:false,inc:[],bills:[],exp:[],funds:[],debts:[],bud:{},wish:[],skipped:0,rem:3};
let S,tab='today';
try{S=Object.assign({},D0,JSON.parse(localStorage.getItem('ffdemo')||'{}'))}catch(e){S=structuredClone(D0)}
if(S.theme==='violet')S.theme='coral';
if(!['$','£','€'].includes(S.cur))S.cur='$';
const save=()=>{try{localStorage.setItem('ffdemo',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),sum=a=>a.reduce((x,y)=>x+y,0),uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ym=()=>iso(new Date()).slice(0,7),M=n=>S.cur+' '+Math.round(n).toLocaleString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=i=>parseFloat(document.getElementById(i).value)||0,val=i=>document.getElementById(i).value.trim();
function toast(t){const e=$('#toast');e.textContent=t;e.className='show';setTimeout(()=>e.className='',1800)}
function calc(){const n=new Date(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),left=dim-n.getDate()+1;
const inc=sum(S.inc.map(x=>x.amt)),bills=sum(S.bills.map(x=>x.amt)),fm=sum(S.funds.map(x=>x.m||0)),mexp=S.exp.filter(e=>e.d.startsWith(ym())),spent=sum(mexp.map(e=>e.amt)),ts=sum(S.exp.filter(e=>e.d===iso(n)).map(e=>e.amt)),safe=inc-bills-fm-spent;
return{n,left,inc,bills,fm,mexp,spent,ts,safe,per:Math.max(safe,0)/left}}
const catSel=id=>`<select id="${id}">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>`;
function addExp(){if(S.exp.length>=20)return toast('Demo limit: 20 expenses. Full version has no limit.');const a=num('qa');if(a<=0)return toast('Enter an amount');S.exp.unshift({id:uid(),d:val('qd')||iso(new Date()),amt:a,cat:val('qc'),note:val('qn')});save();draw();toast('Added ✓')}
const quick=()=>`<div class="card"><b>⚡ Quick add</b><div class="row"><input id="qa" type="number" inputmode="decimal" placeholder="Amount"><select id="qc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="row"><input id="qn" placeholder="What for? (optional)"><input id="qd" type="date" class="s" style="width:150px" value="${iso(new Date())}"></div><button class="p" style="width:100%" onclick="addExp()">Add expense</button></div>`;
function upBills(){return S.bills.filter(b=>b.p!==ym()).sort((a,b)=>a.day-b.day)}
const dn=s=>Math.round((new Date(iso(new Date())+'T00:00:00')-new Date(s+'T00:00:00'))/864e5);
function streak(){const ds=[...new Set(S.exp.map(e=>e.d))].sort();if(!ds.length)return{cur:0,best:0};let best=0;for(let i=1;i<ds.length;i++)best=Math.max(best,dn(ds[i-1])-dn(ds[i])-1);const cur=Math.max(dn(ds[ds.length-1]),0);return{cur,best:Math.max(best,cur)}}
function weekly(){const r=(a,b)=>S.exp.filter(e=>{const k=dn(e.d);return k>=a&&k<=b}),w=r(0,6),t=sum(w.map(e=>e.amt)),pt=sum(r(7,13).map(e=>e.amt)),by={};w.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0],days=new Set(w.map(e=>e.d)).size,big=[...w].sort((a,b)=>b.amt-a.amt)[0],diff=t-pt,msg=!t?'Nothing logged this week. Log your expenses to get a review.':diff<=0?'Nice, you spent less than last week. Keep it up!':'Spending is up from last week. Pick one category to trim next week.';
return `<div class="card"><b>📝 Weekly review (last 7 days)</b><div class="it"><span>Spent</span><span>${M(t)}</span></div><div class="it"><span>vs previous week</span><span class="${diff>0?'bad':'ok'}">${diff>0?'+':''}${M(diff)}</span></div><div class="it"><span>No-spend days</span><span>${7-days} / 7</span></div>${top?`<div class="it"><span>Top category</span><span>${top[0]} · ${M(top[1])}</span></div>`:''}${big?`<div class="it"><span>Biggest purchase</span><span>${esc(big.note||big.cat)} · ${M(big.amt)}</span></div>`:''}<p class="mu">${msg}</p></div>`}
let vm=ym(),ay=new Date().getFullYear();
const FL={exp:[['amt','Amount',1],['note','Note'],['cat','Category'],['d','Date (YYYY-MM-DD)']],inc:[['name','Name'],['amt','Amount',1],['day','Day of month',1]],bills:[['name','Name'],['amt','Amount',1],['day','Due day',1]],funds:[['name','Name'],['goal','Target',1],['saved','Saved so far',1],['m','Monthly saving',1]],debts:[['name','Name'],['bal','Balance',1],['rate','Interest %',1],['min','Min payment',1]]};
function ed(k,id){const o=S[k].find(x=>x.id===id),t={};for(const[f,l,n]of FL[k]){const v=prompt(l,o[f]??'');if(v===null)return;const x=n?parseFloat(v):v.trim();if(n&&isNaN(x))return toast('Invalid number');t[f]=x}if(k=='exp'){if(!/^\d{4}-\d\d-\d\d$/.test(t.d))t.d=o.d;if(!CATS.includes(t.cat))t.cat='Other'}Object.assign(o,t);save();draw();toast('Updated ✓')}
const due=()=>S.bills.filter(b=>b.p!==ym()&&b.day-new Date().getDate()<=S.rem);
function alerts(){const nd=new Date().getDate(),l=due().sort((a,b)=>a.day-b.day);return l.length?`<div class="card" style="border-color:var(--bad)"><b>🔔 Bill reminders</b>${l.map(b=>{const w=b.day-nd;return `<div class="it"><span>${esc(b.name)} <span class="tag ${w<0?'bad':''}">${w<0?'overdue '+(-w)+'d':w==0?'due today':'in '+w+'d'}</span></span><span>${M(b.amt)} <button class="g" onclick="pay('${b.id}')">Mark paid</button></span></div>`}).join('')}</div>`:''}
function mv(d){const[y,m]=vm.split('-').map(Number);vm=iso(new Date(y,m-1+d,1)).slice(0,7);draw()}
function mnav(vx){return `<div class="card"><div class="row" style="align-items:center"><button class="s" onclick="mv(-1)">◀</button><b style="text-align:center">${new Date(vm+'-01T00:00:00').toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="s" onclick="mv(1)">▶</button></div><div class="mu" style="text-align:center">Spent ${M(sum(vx.map(e=>e.amt)))}</div></div>`}
function annual(){const ms=Array.from({length:12},(_,i)=>{const k=ay+'-'+String(i+1).padStart(2,'0');return{k,i,t:sum(S.exp.filter(e=>e.d.startsWith(k)).map(e=>e.amt))}}),mx=Math.max(1,...ms.map(m=>m.t)),tot=sum(ms.map(m=>m.t)),act=ms.filter(m=>m.t).length,by={},inc=sum(S.inc.map(x=>x.amt));S.exp.filter(e=>e.d.startsWith(ay+'-')).forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
return `<div class="card"><div class="row" style="align-items:center"><button class="s" onclick="ay--;draw()">◀</button><b style="text-align:center">📈 ${ay} overview</b><button class="s" onclick="ay++;draw()">▶</button></div>${ms.map(m=>{const o=inc&&m.t>inc;return `<div class="it" style="display:block;cursor:pointer" onclick="vm='${m.k}';go('spend')"><div style="display:flex;justify-content:space-between"><span>${new Date(ay,m.i,1).toLocaleString('en',{month:'short'})}</span><span class="${o?'bad':'mu'}">${M(m.t)}</span></div><div class="bar ${o?'over':''}"><i style="width:${m.t/mx*100}%"></i></div></div>`}).join('')}<div class="it"><span>Total spent</span><b>${M(tot)}</b></div><div class="it"><span>Average per active month</span><span>${M(act?tot/act:0)}</span></div>${top?`<div class="it"><span>Top category</span><span>${top[0]} · ${M(top[1])}</span></div>`:''}<p class="mu">Tap a month to open it. Red = spent more than your monthly income.</p></div>`}
function csv(){const t='date,category,note,amount\n'+S.exp.map(e=>[e.d,e.cat,'"'+(e.note||'').replace(/"/g,'""')+'"',e.amt].join(',')).join('\n'),b=$('#bk');b.value=t;b.select();try{navigator.clipboard.writeText(t).then(()=>toast('CSV copied ✓'))}catch(x){toast('Copy the text in the box')}}
const views={
today(){const c=calc(),pct=c.inc?Math.min(100,(c.spent+c.bills+c.fm)/c.inc*100):0,nd=c.n.getDate();
let h=`<div class="card hero ${c.safe<0?'neg':''}"><div class="mu">Safe to spend this month</div><div class="big">${M(c.safe)}</div><div class="mu">≈ <b>${M(c.per)}</b> per day · ${c.left} days left · today ${M(c.ts)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
if(!S.inc.length)h+=`<div class="card"><b>👋 Start here (2 minutes)</b><p class="mu">1) Bills tab → add your income and bills. 2) Come back and add expenses in one tap. Nothing is linked to your bank.</p><button class="p" onclick="go('bills')">Add income & bills</button></div>`;
h+=alerts()+quick();if(S.focus)return h;const sk=streak();h+=`<div class="card"><b>🔥 No-spend streak 🔒</b><div class="mu">Included in the full version</div></div>`+(new Date().getDay()==0?'<div class="card"><b>📝 Your weekly review is ready</b><br><button class="p" style="margin-top:8px" onclick="go(\'plan\')">Open review</button></div>':'');
const up=upBills().slice(0,3),pay=S.inc.map(i=>({...i,w:i.day>=nd?i.day-nd:i.day+30-nd})).sort((a,b)=>a.w-b.w)[0];
h+=`<div class="card"><b>📅 Coming up</b>${pay?`<div class="it"><span>💰 ${esc(pay.name)}</span><span class="ok">${pay.w?'in '+pay.w+' days':'today'}</span></div>`:''}${up.map(b=>`<div class="it"><span>${esc(b.name)} <span class="tag">day ${b.day}</span></span><span class="${b.day<nd?'bad':''}">${M(b.amt)}${b.day<nd?' · overdue':''}</span></div>`).join('')||'<p class="mu">No unpaid bills 🎉</p>'}</div>`;
if(S.funds.length)h+=`<div class="card"><b>🎯 Goals</b>${S.funds.slice(0,3).map(f=>`<div class="it" style="display:block"><div style="display:flex;justify-content:space-between"><span>${esc(f.name)}</span><span class="mu">${M(f.saved)} / ${M(f.goal)}</span></div><div class="bar"><i style="width:${Math.min(100,f.saved/f.goal*100||0)}%"></i></div></div>`).join('')}</div>`;
if(S.skipped)h+=`<div class="card ok">🧠 You saved <b>${M(S.skipped)}</b> by waiting on impulse buys.</div>`;
return h},
spend(){const vx=S.exp.filter(e=>e.d.startsWith(vm)),by={};vx.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);
return quick()+mnav(vx)+`<div class="card"><b>By category</b>${CATS.filter(k=>by[k]||S.bud[k]).map(k=>{const l=S.bud[k]||0,p=l?by[k]/l*100:0;return `<div class="it" style="display:block"><div style="display:flex;justify-content:space-between"><span>${k}</span><span class="${p>100?'bad':'mu'}">${M(by[k]||0)}${l?' / '+M(l):''}</span></div>${l?`<div class="bar ${p>100?'over':''}"><i style="width:${Math.min(100,p)}%"></i></div>`:''}</div>`}).join('')||'<p class="mu">Nothing yet.</p>'}</div>
<div class="card"><b>Recent</b>${vx.slice(0,60).map(e=>`<div class="it"><span>${esc(e.note||e.cat)} <span class="tag">${e.cat} · ${e.d.slice(5)}</span></span><span>${M(e.amt)} <button class="g" onclick="ed('exp','${e.id}')">✏️</button><button class="g" onclick="del('exp','${e.id}')">✕</button></span></div>`).join('')||'<p class="mu">No expenses yet.</p>'}</div>`},
bills(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
let cal='<div class="cal">'+'SMTWTFS'.split('').map(d=>`<b>${d}</b>`).join('')+'<span></span>'.repeat(f);
for(let d=1;d<=dim;d++)cal+=`<span class="${d==n.getDate()?'now':''}">${d}${S.bills.some(x=>x.day==d)?'<u class="u1"></u>':''}${S.inc.some(x=>x.day==d)?'<u class="u2"></u>':''}</span>`;
return `<div class="card"><b>${n.toLocaleString('en',{month:'long',year:'numeric'})}</b> <span class="mu">● bill ● payday</span>${cal}</div></div>
<div class="card"><b>💰 Income / paydays</b>${S.inc.map(i=>`<div class="it"><span>${esc(i.name)} <span class="tag">day ${i.day}</span></span><span class="ok">${M(i.amt)} <button class="g" onclick="ed('inc','${i.id}')">✏️</button><button class="g" onclick="del('inc','${i.id}')">✕</button></span></div>`).join('')}
<div class="row"><input id="in" placeholder="Name (Salary)"><input id="ia" type="number" inputmode="decimal" placeholder="Amount"><input id="id" type="number" class="s" style="width:80px" placeholder="Day" min="1" max="31"></div><button class="p" onclick="addI()">Add income</button></div>
<div class="card"><b>🧾 Bills</b>${S.bills.sort((a,b)=>a.day-b.day).map(b=>`<div class="it"><span><button class="g" onclick="pay('${b.id}')">${b.p===ym()?'✅':'⬜'}</button>${esc(b.name)} <span class="tag">day ${b.day}</span></span><span>${M(b.amt)} <button class="g" onclick="ed('bills','${b.id}')">✏️</button><button class="g" onclick="del('bills','${b.id}')">✕</button></span></div>`).join('')}
<div class="row"><input id="bn" placeholder="Bill name"><input id="ba" type="number" inputmode="decimal" placeholder="Amount"><input id="bd" type="number" class="s" style="width:80px" placeholder="Day" min="1" max="31"></div><button class="p" onclick="addB()">Add bill</button></div>`},
money(){const av=ord=>sim(ord),A=S.debts.length?sim(d=>[...d].sort((a,b)=>b.rate-a.rate)):0,B=S.debts.length?sim(d=>[...d].sort((a,b)=>a.bal-b.bal)):0;
return `<div class="card"><b>🎯 Savings goals</b>${S.funds.map(f=>`<div class="it" style="display:block"><div style="display:flex;justify-content:space-between"><span>${esc(f.name)}</span><span>${M(f.saved)} / ${M(f.goal)}</span></div><div class="bar"><i style="width:${Math.min(100,f.saved/f.goal*100||0)}%"></i></div><div class="mu">${f.m?'Monthly: '+M(f.m)+' · ':''}<button class="g" onclick="topup('${f.id}')">+ Add money</button><button class="g" onclick="ed('funds','${f.id}')">Edit</button><button class="g" onclick="del('funds','${f.id}')">Delete</button></div></div>`).join('')}
<div class="row"><input id="fn" placeholder="Goal (Emergency fund)"><input id="fg" type="number" placeholder="Target"></div><div class="row"><input id="fs" type="number" placeholder="Saved so far"><input id="fm" type="number" placeholder="Monthly saving"></div><button class="p" onclick="addF()">Add goal</button></div>
<div class="card"><b>💳 Debts</b>${S.debts.map(d=>`<div class="it"><span>${esc(d.name)} <span class="tag">${d.rate}% · min ${M(d.min)}</span></span><span>${M(d.bal)} <button class="g" onclick="pd('${d.id}')">Pay</button><button class="g" onclick="ed('debts','${d.id}')">✏️</button><button class="g" onclick="del('debts','${d.id}')">✕</button></span></div>`).join('')}
<div class="row"><input id="dn" placeholder="Debt name"><input id="db" type="number" placeholder="Balance"></div><div class="row"><input id="dr" type="number" placeholder="Interest %"><input id="dm" type="number" placeholder="Min payment"></div><button class="p" onclick="addD()">Add debt</button>
${A?`<p class="mu">Paying minimums + rolling freed money: <b>Avalanche</b> (highest interest first) ${A.m>=600?'never ends':A.m+' months'}, interest ${M(A.i)} · <b>Snowball</b> (smallest first) ${B.m>=600?'never ends':B.m+' months'}, interest ${M(B.i)}.</p>`:''}</div>`},
plan(){const c=calc(),by={};c.mexp.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);
return weekly()+annual()+`<div class="card"><b>🧠 24-hour wait list</b><p class="mu">Want something now? Add it here, wait a day, then decide. Fights impulse buys.</p>${S.wish.map(w=>{const h=Math.max(0,24-(Date.now()-w.t)/36e5),r=h<=0;return `<div class="it"><span>${esc(w.name)} <span class="tag">${r?'ready to decide':Math.ceil(h)+'h left'}</span></span><span>${M(w.amt)} ${r?`<button class="g" onclick="wb('${w.id}',1)">Buy</button><button class="g" onclick="wb('${w.id}',0)">Skip</button>`:`<button class="g" onclick="del('wish','${w.id}')">✕</button>`}</span></div>`}).join('')}
<div class="row"><input id="wn" placeholder="Item"><input id="wa" type="number" placeholder="Price"></div><button class="p" onclick="addW()">Start 24h wait</button></div>
<div class="card"><b>📊 Monthly limits per category</b><p class="mu">Optional. Leave 0 for no limit.</p>${CATS.map(k=>`<div class="row" style="align-items:center"><span>${k}</span><input type="number" value="${S.bud[k]||''}" placeholder="0" onchange="S.bud['${k}']=+this.value;save();toast('Saved')"></div>`).join('')}</div>
<div class="card"><b>📈 This month</b><div class="it"><span>Income</span><span class="ok">${M(c.inc)}</span></div><div class="it"><span>Bills</span><span>${M(c.bills)}</span></div><div class="it"><span>Savings plan</span><span>${M(c.fm)}</span></div><div class="it"><span>Spent</span><span>${M(c.spent)}</span></div><div class="it"><b>Left</b><b class="${c.safe<0?'bad':'ok'}">${M(c.safe)}</b></div></div>`},
more(){return `<div class="card"><b>🎨 Theme</b><div class="sw" style="margin:10px 0">${TH.map(t=>`<button class="${S.theme==t[0]?'on':''}" style="background:${t[1]}" onclick="S.theme='${t[0]}';save();apply();draw()" aria-label="${t[0]}"></button>`).join('')}</div>
<div class="row"><select onchange="S.mode=this.value;save();apply()">${['auto','light','dark'].map(m=>`<option ${S.mode==m?'selected':''} value="${m}">${m[0].toUpperCase()+m.slice(1)} mode</option>`).join('')}</select><select onchange="S.cur=this.value;save();toast('Saved')">${['$','£','€'].map(m=>`<option ${S.cur==m?'selected':''}>${m}</option>`).join('')}</select></div></div>
<div class="card"><b>🔔 Bill reminders</b><div class="row"><select onchange="S.rem=+this.value;save();toast('Saved')">${[0,1,2,3,5,7].map(n=>`<option value="${n}" ${S.rem==n?'selected':''}>${n?'Remind '+n+' days before due':'Remind on due day only'}</option>`).join('')}</select></div></div>
<div class="card"><b>💾 Backup & restore</b><p class="mu">Your data is stored only in this browser on this device. No account, no bank link, nothing is sent anywhere. To move devices, copy the backup and paste it on the other device.</p><textarea id="bk" rows="4" placeholder="Backup text appears here / paste to restore"></textarea><div class="row"><button onclick="bkp()">Copy backup</button><button onclick="csv()">Copy CSV</button><button class="p" onclick="rst()">Restore</button></div></div>
<div class="card"><button style="width:100%;color:var(--bad)" onclick="if(confirm('Delete ALL data?')){S=structuredClone(D0);save();draw()}">Reset everything</button></div>
<p class="mu" style="text-align:center">Not financial advice. Works on phone and desktop.</p>`}};
function sim(o){let d=S.debts.map(x=>({...x})),m=0,i=0;const pool=sum(d.map(x=>x.min));while(d.some(x=>x.bal>0)&&m<600&&pool>0){m++;let p=pool;d.forEach(x=>{if(x.bal>0){const t=x.bal*x.rate/1200;x.bal+=t;i+=t;const a=Math.min(x.min,x.bal);x.bal-=a;p-=a}});for(const x of o(d)){if(x.bal>0&&p>0){const a=Math.min(p,x.bal);x.bal-=a;p-=a}}}return{m:pool>0?m:600,i}}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();draw()}
function go(t){tab=t;draw();scrollTo(0,0)}
function addI(){if(S.inc.length>=1)return toast('Demo limit: 1 income source.');const a=num('ia');if(!val('in')||a<=0)return toast('Add name and amount');S.inc.push({id:uid(),name:val('in'),amt:a,day:Math.min(31,Math.max(1,num('id')||1))});save();draw()}
function addB(){if(S.bills.length>=3)return toast('Demo limit: 3 bills.');const a=num('ba');if(!val('bn')||a<=0)return toast('Add name and amount');S.bills.push({id:uid(),name:val('bn'),amt:a,day:Math.min(31,Math.max(1,num('bd')||1))});save();draw()}
function pay(id){const b=S.bills.find(x=>x.id===id);b.p=b.p===ym()?'':ym();save();draw()}
function addF(){if(!val('fn')||num('fg')<=0)return toast('Add name and target');S.funds.push({id:uid(),name:val('fn'),goal:num('fg'),saved:num('fs'),m:num('fm')});save();draw()}
function topup(id){const a=parseFloat(prompt('Amount to add?'));if(a>0){S.funds.find(x=>x.id===id).saved+=a;save();draw()}}
function addD(){if(!val('dn')||num('db')<=0)return toast('Add name and balance');S.debts.push({id:uid(),name:val('dn'),bal:num('db'),rate:num('dr'),min:num('dm')});save();draw()}
function pd(id){const a=parseFloat(prompt('Payment amount?')),d=S.debts.find(x=>x.id===id);if(a>0){d.bal=Math.max(0,d.bal-a);S.exp.unshift({id:uid(),d:iso(new Date()),amt:a,cat:'Bills',note:'Debt: '+d.name});if(!d.bal)S.debts=S.debts.filter(x=>x.id!==id);save();draw()}}
function addW(){if(!val('wn')||num('wa')<=0)return toast('Add item and price');S.wish.push({id:uid(),name:val('wn'),amt:num('wa'),t:Date.now()});save();draw()}
function wb(id,buy){const w=S.wish.find(x=>x.id===id);if(buy)S.exp.unshift({id:uid(),d:iso(new Date()),amt:w.amt,cat:'Shopping',note:w.name});else S.skipped+=w.amt;S.wish=S.wish.filter(x=>x.id!==id);save();draw()}
function bkp(){const t=JSON.stringify(S),e=$('#bk');e.value=t;e.select();try{navigator.clipboard.writeText(t).then(()=>toast('Copied ✓'))}catch(x){toast('Copy the text in the box')}}
function rst(){try{const o=JSON.parse(val('bk'));S=Object.assign({},D0,o);save();apply();draw();toast('Restored ✓')}catch(e){toast('Invalid backup text')}}
function apply(){const dk=S.mode=='dark'||(S.mode=='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.t=S.theme;document.documentElement.dataset.d=dk?'1':'0'}
const IC={today:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',spend:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',bills:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',money:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',plan:'<path d="M18 20V10M12 20V4M6 20v-6"/>',more:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'};
const svg=p=>`<svg viewBox="0 0 24 24">${p}</svg>`,TT={today:'Today',spend:'Spend',bills:'Bills',money:'Money 🔒',plan:'Plan 🔒',more:'More'};
function rail(){const c=calc(),pc=f=>Math.min(100,f.saved/f.goal*100||0),g=S.funds.slice(0,4).map(f=>`<div class="rg"><div style="display:flex;justify-content:space-between"><span>${esc(f.name)}</span><span class="mu">${Math.round(pc(f))}%</span></div><div class="bar"><i style="width:${pc(f)}%"></i></div></div>`).join('')||'<p class="mu">Add savings goals in Money.</p>',u=S.bills.filter(b=>b.p!==ym()).sort((a,b)=>a.day-b.day).slice(0,4).map(b=>`<div class="it"><span>${esc(b.name)}<br><span class="mu" style="font-size:12px">Day ${b.day}</span></span><b>${M(b.amt)}</b></div>`).join('')||'<p class="mu">No unpaid bills 🎉</p>';
return `<div class="card"><b>Left this month</b><div class="big" style="font-size:28px;color:var(--ac)">${M(c.safe)}</div><div class="mu">${M(c.per)} per day</div></div><div class="card"><b>Progress</b>${g}</div><div class="card"><b>Upcoming bills</b>${u}</div>`}
function sb(){$('#nav').classList.toggle('open')}
document.addEventListener('click',e=>{const n=$('#nav');if(n.classList.contains('open')&&!e.composedPath().includes(n))n.classList.remove('open')});
function draw(){$('#app').innerHTML=(tab=='today'?'<div class="card" style="background:var(--ac);color:#fff"><b>👋 Free demo</b><br>Try the core features. Limits: 1 income, 3 bills, 20 expenses. Savings goals, debt payoff, wait list, weekly review, annual overview, limits, backup and all themes are in the full version.</div>':'')+views[tab]();$('#ttl').textContent=TT[tab];$('#rp').innerHTML=rail();$('#fb').textContent=S.focus?'🎯 Focus: ON':'🎯 Focus: off';
const dc=due().length;$('#nav').innerHTML=`<button onclick="sb()" aria-label="Menu">${svg('<path d="M3 6h18M3 12h18M3 18h18"/>')}<span class="lb">FocusFund</span></button><div style="height:10px"></div>`+Object.keys(TT).map(k=>`<button class="${tab==k?'on':''}" onclick="go('${k}');if(innerWidth<800)$('#nav').classList.remove('open')" aria-label="${TT[k]}">${svg(IC[k])}<span class="lb">${TT[k]}</span>${k=='bills'&&dc?`<b class="bd">${dc}</b>`:''}</button>`).join('')}
const lockCard=t=>`<div class="card" style="text-align:center"><div style="font-size:42px">🔒</div><b>${t}</b><p class="mu">This part is included in the full FocusFund planner.</p><p><b>Get the full version on Etsy</b> to unlock everything.</p></div>`;
views.money=()=>lockCard('Savings goals & debt payoff');
views.plan=()=>lockCard('24-hour wait list, weekly review, annual overview & category limits');
views.more=()=>`<div class="card"><b>🎨 Theme</b><div class="sw" style="margin:10px 0">${TH.slice(0,2).map(t=>`<button class="${S.theme==t[0]?'on':''}" style="background:${t[1]}" onclick="S.theme='${t[0]}';save();apply();draw()" aria-label="${t[0]}"></button>`).join('')}</div><div class="row"><select onchange="S.cur=this.value;save();draw()">${['$','£','€'].map(m=>`<option ${S.cur==m?'selected':''}>${m}</option>`).join('')}</select><select onchange="S.mode=this.value;save();apply()">${['light','dark','auto'].map(m=>`<option ${S.mode==m?'selected':''} value="${m}">${m[0].toUpperCase()+m.slice(1)} mode</option>`).join('')}</select></div><p class="mu">4 more themes in the full version.</p></div>`+lockCard('Backup, CSV export & reminder settings')+`<div class="card"><button style="width:100%" onclick="if(confirm('Reset demo data?')){S=structuredClone(D0);save();draw()}">Reset demo</button></div><p class="mu" style="text-align:center">Your demo data stays in this browser only.</p>`;
function rail(){const c=calc(),u=S.bills.filter(b=>b.p!==ym()).sort((a,b)=>a.day-b.day).slice(0,4).map(b=>`<div class="it"><span>${esc(b.name)}<br><span class="mu" style="font-size:12px">Day ${b.day}</span></span><b>${M(b.amt)}</b></div>`).join('')||'<p class="mu">No unpaid bills 🎉</p>';
return `<div class="card"><b>Left this month</b><div class="big" style="font-size:28px;color:var(--ac)">${M(c.safe)}</div><div class="mu">${M(c.per)} per day</div></div><div class="card"><b>Upcoming bills</b>${u}</div><div class="card" style="text-align:center"><b>🔒 Goals, debt & more</b><p class="mu">Unlock everything in the full version on Etsy.</p></div>`}
apply();draw();
</script></body></html>
